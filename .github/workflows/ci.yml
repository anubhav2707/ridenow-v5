name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every provider defaults to its deterministic MOCK adapter, so CI needs zero
  # secrets to run the whole pipeline green.
  OTP_PROVIDER: mock
  PAYMENT_PROVIDER: mock
  GEO_PROVIDER: mock

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  manifest:
    # Enforces the manifest-integrity AC: every path referenced by a manifest
    # (compose, Dockerfile, workspace config, turbo, fly) must exist in the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-manifests.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks secret scan
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  smoke:
    # The real e2e proof that the full stack comes up: build + start the compose
    # stack (Postgres+PostGIS + API), apply migrations/seed, and curl /health.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the stack
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          n=0
          until curl -fsS http://localhost:3000/health >/dev/null 2>&1; do
            n=$((n + 1))
            if [ "$n" -ge 60 ]; then
              echo "API did not become healthy in time"
              docker compose logs
              exit 1
            fi
            sleep 3
          done
          echo "health payload:"
          curl -fsS http://localhost:3000/health
      - name: Exercise the faked core loop
        run: bash scripts/watch-loop.sh
      - name: Tear down
        if: always()
        run: docker compose down -v
