# RideNow v5 — localhost stack. Deliberately scoped to Postgres+PostGIS + the API.
# Self-hosting OSRM/Nominatim (hours-long, 100s of GB) is DEFERRED to the geo story.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ridenow
      POSTGRES_PASSWORD: ridenow
      POSTGRES_DB: ridenow
    ports:
      - "5432:5432"
    volumes:
      - ridenow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridenow -d ridenow"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ridenow:ridenow@db:5432/ridenow
      PORT: "3000"
      OTP_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      GEO_PROVIDER: mock
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ridenow_pgdata:
