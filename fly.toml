# Deploy config for the RideNow API container. Provisioning the reachable URL and
# its secrets (DATABASE_URL etc.) is a HUMAN-GATED step — no secrets live in this repo.
app = "ridenow-v5-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "3000"
  OTP_PROVIDER = "mock"
  PAYMENT_PROVIDER = "mock"
  GEO_PROVIDER = "mock"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
